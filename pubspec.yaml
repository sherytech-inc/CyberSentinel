name: cybersentinel
description: A cybersecurity dashboard application built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Icons
  lucide_icons_flutter: ^1.0.0
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Utilities
  intl: ^0.19.0
  
  # Markdown
  flutter_markdown: ^0.7.4
  
  # HTTP (for future API integration)
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  file_picker: ^8.1.2
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
